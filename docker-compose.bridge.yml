services:
  telecodex-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    env_file:
      - .env
    environment:
      TELECODEX_RUNTIME_MODE: remote-bridge
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - ../bridge-state:/data/bridge-state:rw
      - ../bridge-logs:/data/bridge-logs:rw
    restart: unless-stopped
