version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
